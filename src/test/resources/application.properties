spring.application.name=library

# All deployment-/connection-sensitive values come from .env (same as main).
# Caller is responsible for pointing DB_NAME at a TEST database — `bookRepository.deleteAll()`
# in BookControllerTest will wipe whatever DB this resolves to.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Fresh schema for every test run — independent of main DB_DDL_AUTO
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT — hardcoded so tests don't depend on .env. Test-only value.
jwt.secret=test-secret-do-not-use-in-prod-needs-at-least-32-bytes-padding
jwt.access-ttl=PT15M
jwt.refresh-ttl=P7D

# Dummy URL — Feign client is not actually exercised by these tests, but the
# bean still has to be instantiable when the full context loads.
app.welcome-notifier.base-url=http://localhost:9999/notifier-test
