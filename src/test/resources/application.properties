spring.application.name=library

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=true

logging.level.root=WARN
logging.level.com.training.library=WARN
logging.pattern.level=%5p [%X{requestId:-}]

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

jwt.secret=test-secret-do-not-use-in-prod-needs-at-least-32-bytes-padding
jwt.access-ttl=PT15M
jwt.refresh-ttl=P7D

app.welcome-notifier.base-url=http://localhost:9999/notifier-test

spring.cloud.openfeign.client.config.welcomeNotifier.connect-timeout=200
spring.cloud.openfeign.client.config.welcomeNotifier.read-timeout=300
spring.cloud.openfeign.client.config.welcomeNotifier.logger-level=none

resilience4j.retry.instances.welcomeNotifier.max-attempts=1
resilience4j.retry.instances.welcomeNotifier.wait-duration=10ms
resilience4j.circuitbreaker.instances.welcomeNotifier.sliding-window-size=2
resilience4j.circuitbreaker.instances.welcomeNotifier.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.welcomeNotifier.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.welcomeNotifier.wait-duration-in-open-state=1s
