spring.application.name=library

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Password@123

# JPA / Hibernate behavior
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----- Logging -----
# Per-package levels. Override at run time with --logging.level.<pkg>=DEBUG
# or env var LOGGING_LEVEL_<PKG_UPPERCASE_WITH_UNDERSCORES>=DEBUG.
logging.level.root=INFO
logging.level.com.training.library=INFO
# Handy toggles when troubleshooting:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.transaction=TRACE
# logging.level.org.springframework.web=DEBUG

# Console output format.
#   unset / empty   -> human-readable Logback pattern (default, what you want locally)
#   ecs             -> Elastic Common Schema JSON   (Elasticsearch / Kibana)
#   gelf            -> Graylog Extended Log Format
#   logstash        -> Logstash JSON
# Switch on by uncommenting:
# logging.structured.format.console=logstash
