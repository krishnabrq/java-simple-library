spring.application.name=library

# Pull deployment-/debug-sensitive values from .env in the project root.
# `optional:` => missing file is fine (e.g. CI sets env vars directly).
# `[.properties]` => parse a file without that extension as a properties file.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL database (host/port/name/credentials from env; driver is fixed)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate behavior
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ----- Logging -----
# Per-package levels. Defaults via .env (LOG_LEVEL_ROOT / LOG_LEVEL_APP); also
# overridable at run time via --logging.level.<pkg>=DEBUG or env LOGGING_LEVEL_*.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.training.library=${LOG_LEVEL_APP:INFO}
# Handy toggles when troubleshooting:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.transaction=TRACE
# logging.level.org.springframework.web=DEBUG

# Console output format.
#   unset / empty   -> human-readable Logback pattern (default, what you want locally)
#   ecs             -> Elastic Common Schema JSON   (Elasticsearch / Kibana)
#   gelf            -> Graylog Extended Log Format
#   logstash        -> Logstash JSON
logging.structured.format.console=${LOG_STRUCTURED_FORMAT:}

# ----- JWT -----
# HS256 shared secret. Must be at least 32 bytes (256 bits). No default — startup fails
# fast if JWT_SECRET is missing from .env or the OS env. Generate one with:
#   openssl rand -base64 32
jwt.secret=${JWT_SECRET}
# ISO-8601 durations (PT15M = 15 minutes, P7D = 7 days).
jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}
