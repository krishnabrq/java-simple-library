spring.application.name=library

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.training.library=${LOG_LEVEL_APP:INFO}

logging.structured.format.console=${LOG_STRUCTURED_FORMAT:}
logging.pattern.level=%5p [%X{requestId:-}]

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

jwt.secret=${JWT_SECRET}
jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}

app.welcome-notifier.base-url=${WELCOME_NOTIFIER_URL:https://jsonplaceholder.typicode.com}

spring.cloud.openfeign.client.config.welcomeNotifier.connect-timeout=2000
spring.cloud.openfeign.client.config.welcomeNotifier.read-timeout=3000
spring.cloud.openfeign.client.config.welcomeNotifier.logger-level=basic

resilience4j.retry.instances.welcomeNotifier.max-attempts=3
resilience4j.retry.instances.welcomeNotifier.wait-duration=500ms
resilience4j.retry.instances.welcomeNotifier.enable-exponential-backoff=true
resilience4j.retry.instances.welcomeNotifier.exponential-backoff-multiplier=2
resilience4j.retry.instances.welcomeNotifier.retry-exceptions=\
  feign.RetryableException,\
  feign.FeignException$FeignServerException

resilience4j.circuitbreaker.instances.welcomeNotifier.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.welcomeNotifier.sliding-window-size=10
resilience4j.circuitbreaker.instances.welcomeNotifier.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.welcomeNotifier.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.welcomeNotifier.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.welcomeNotifier.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.welcomeNotifier.automatic-transition-from-open-to-half-open-enabled=true
