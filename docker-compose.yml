services:
  postgres:
    image: postgres:17-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-library}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - library-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-library}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-app:latest
    container_name: library-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-library}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_DDL_AUTO: ${DB_DDL_AUTO:-validate}
      DB_SHOW_SQL: ${DB_SHOW_SQL:-false}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_STRUCTURED_FORMAT: ${LOG_STRUCTURED_FORMAT:-}
      JWT_SECRET: ${JWT_SECRET:-please-override-me-with-openssl-rand-base64-32}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      WELCOME_NOTIFIER_URL: ${WELCOME_NOTIFIER_URL:-https://jsonplaceholder.typicode.com}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  library-pgdata:
