buildscript {
	repositories { mavenCentral() }
	dependencies { classpath 'org.liquibase:liquibase-core:4.31.1' }
}

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version "7.2.1"
	id 'org.liquibase.gradle' version '3.1.0'
}

spotless {
	java {
		importOrder()
		removeUnusedImports()
		cleanthat()
		googleJavaFormat('1.28.0')
	}
}

group = 'com.training'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

ext {
	set('springCloudVersion', '2025.0.0')
	set('resilience4jVersion', '2.2.0')
}

repositories {
	gradlePluginPortal()
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
	implementation 'org.mapstruct:mapstruct:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.liquibase:liquibase-core'
	liquibaseRuntime 'org.liquibase:liquibase-core:4.31.1'
	liquibaseRuntime 'org.postgresql:postgresql:42.7.4'
	liquibaseRuntime 'org.yaml:snakeyaml:2.2'
	liquibaseRuntime 'info.picocli:picocli:4.7.5'
	liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate6:4.31.1'
	liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.7'
	liquibaseRuntime sourceSets.main.output
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


test {
	useJUnitPlatform()

	reports {
		junitXml.required = true
		html.required = true
	}

	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test

	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

def dbHost = System.getenv('DB_HOST') ?: 'localhost'
def dbPort = System.getenv('DB_PORT') ?: '5432'
def dbName = System.getenv('DB_NAME') ?: 'library'
def dbUser = System.getenv('DB_USER') ?: 'postgres'
def dbPassword = System.getenv('DB_PASSWORD') ?: ''

liquibase {
	activities {
		main {
			changelogFile 'src/main/resources/db/changelog/db.changelog-master.yaml'
			url "jdbc:postgresql://${dbHost}:${dbPort}/${dbName}"
			username dbUser
			if (dbPassword) {
				password dbPassword
			}
			driver 'org.postgresql.Driver'
			logLevel 'info'
		}
		diff {
			changelogFile project.findProperty('outputChangelog') ?: 'liquibase-diff-output.yaml'
			url "jdbc:postgresql://${dbHost}:${dbPort}/${dbName}"
			username dbUser
			if (dbPassword) {
				password dbPassword
			}
			driver 'org.postgresql.Driver'
			referenceUrl 'hibernate:spring:com.training.library?dialect=org.hibernate.dialect.PostgreSQLDialect&hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy'
			defaultSchemaName 'public'
			referenceDefaultSchemaName 'public'
			logLevel 'info'
		}
	}
	runList = project.findProperty('liquibaseRunList') ?: 'main'
}

tasks.matching { it.name in ['diffChangelog', 'diff', 'generateChangelog', 'snapshot'] }
		.configureEach { dependsOn 'compileJava' }
